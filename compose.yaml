services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: revenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: revenda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenda -d revenda"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
